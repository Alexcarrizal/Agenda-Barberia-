<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Agenda Barbería — Gestión de citas y clientes</title>
    <meta
      name="description"
      content="Agenda móvil privada para barberos: gestiona citas, espacios libres, bloqueos de horario, clientes y recordatorios directos por WhatsApp."

    <meta property="og:title" content="Agenda Barbería — Gestión de citas y clientes" />
    <meta
      property="og:description"
      content="Agenda móvil privada para barberos: gestiona citas, espacios libres, bloqueos de horario, clientes y recordatorios directos por WhatsApp."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />
    <script>
      try {
        var raw = localStorage.getItem('agenda_barberia_state_v1');
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.settings && parsed.settings.theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#F2F4F7] dark:bg-[#0B1120] text-slate-900 dark:text-slate-100 antialiased selection:bg-[#1B3B6F]/15 dark:selection:bg-blue-500/25 selection:text-[#1B3B6F] dark:selection:text-blue-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
